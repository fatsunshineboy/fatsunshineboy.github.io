<!-- Starfield background placeholder -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="0%" r="100%">
      <stop offset="0%" style="stop-color:#0a0a15;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#121220;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#skyGrad)" />
  <!-- Stars -->
  <g fill="#fff">
    <circle cx="100" cy="80" r="1" opacity="0.8"/>
    <circle cx="200" cy="120" r="0.5" opacity="0.6"/>
    <circle cx="350" cy="60" r="1" opacity="0.9"/>
    <circle cx="450" cy="150" r="0.5" opacity="0.5"/>
    <circle cx="580" cy="90" r="1" opacity="0.7"/>
    <circle cx="720" cy="180" r="0.5" opacity="0.6"/>
    <circle cx="850" cy="70" r="1" opacity="0.8"/>
    <circle cx="980" cy="140" r="0.5" opacity="0.7"/>
    <circle cx="1100" cy="100" r="1" opacity="0.9"/>
    <circle cx="1250" cy="160" r="0.5" opacity="0.6"/>
    <circle cx="1400" cy="80" r="1" opacity="0.8"/>
    <circle cx="1550" cy="120" r="0.5" opacity="0.7"/>
    <circle cx="1700" cy="190" r="1" opacity="0.9"/>
    <circle cx="1820" cy="100" r="0.5" opacity="0.6"/>
