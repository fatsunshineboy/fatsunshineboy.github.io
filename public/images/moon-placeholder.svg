<!-- Moon placeholder - Replace with actual moon HD image -->
<!-- Download from: https://www.nasa.gov/images/moon-hd -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="moonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c4c4c4;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#8a8a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a4a4a;stop-opacity:1" />
    </radialGradient>
    <filter id="crater">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" />
      <feDisplacementMap in="SourceGraphic" scale="10" />
    </filter>
  </defs>
  <circle cx="256" cy="256" r="250" fill="url(#moonGrad)" />
  <!-- Craters -->
  <circle cx="150" cy="180" r="25" fill="rgba(0,0,0,0.15)" />
  <circle cx="200" cy="220" r="35" fill="rgba(0,0,0,0.12)" />
  <circle cx="280" cy="200" r="45" fill="rgba(0,0,0,0.1)" />
  <circle cx="350" cy="280" r="30" fill="rgba(0,0,0,0.15)" />
  <circle cx="180" cy="320" r="20" fill="rgba(0,0,0,0.12)" />
  <circle cx="320" cy="350" r="40" fill="rgba(0,0,0,0.1)" />
  <circle cx="256" cy="150" r="15" fill="rgba(0,0,0,0.08)" />
  <circle cx="380" cy="180" r="25" fill="rgba(0,0,0,0.1)" />
  <circle cx="120" cy="250" r="30" fill="rgba(0,0,0,0.12)" />
  <circle cx="230" cy="380" r="25" fill="rgba(0,0,0,0.1)" />
  <!-- Maria (dark patches) -->
  <ellipse cx="200" cy="250" rx="60" ry="40" fill="rgba(0,0,0,0.08)" />
  <ellipse cx="300" cy="300" rx="50" ry="35" fill="rgba(0,0,0,0.06)" />
  <ellipse cx="250" cy="180" rx="40" ry="30" fill="rgba(0,0,0,0.05)" />
</svg>
